<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Task Manager - 태그 및 필터 기반 할 일 관리</title>
  <!-- 구글 폰트 (Pretendard 대체용 Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- 외부 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 메인 위젯 컨테이너 -->
  <main class="app-container">
    <!-- 헤더 영역 -->
    <header class="app-header">
      <div class="header-icon-wrapper">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
      </div>
      <div class="header-content">
        <h1 class="app-title">My Task Manager</h1>
        <p class="app-subtitle">오늘의 할 일을 계획하고 관리해 보세요.</p>
      </div>
      <div class="header-date" id="current-date-display"></div>
    </header>

    <!-- 진행 현황 대시보드 섹션 -->
    <section class="stats-card-container" aria-label="진행 현황 대시보드">
      <div class="stats-grid">
        <!-- 전체 할 일 카드 -->
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-label">전체 할 일</span>
            <span class="stat-icon-badge total">📋</span>
          </div>
          <div class="stat-value" id="stat-total">0</div>
        </div>

        <!-- 완료한 할 일 카드 -->
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-label">완료한 할 일</span>
            <span class="stat-icon-badge completed">✅</span>
          </div>
          <div class="stat-value" id="stat-completed">0</div>
        </div>

        <!-- 남은 할 일 카드 -->
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-label">남은 할 일</span>
            <span class="stat-icon-badge pending">⏳</span>
          </div>
          <div class="stat-value" id="stat-pending">0</div>
        </div>
      </div>

      <!-- 진행률 바 섹션 -->
      <div class="progress-wrapper">
        <div class="progress-info">
          <span class="progress-title">전체 진행률</span>
          <span class="progress-percentage" id="progress-text">0%</span>
        </div>
        <div class="progress-bar-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
        </div>
      </div>
    </section>

    <!-- 할 일 등록 입력 영역 -->
    <section class="input-card" aria-label="새로운 할 일 등록">
      <form id="todo-form" class="todo-form" autocomplete="off">
        <div class="form-row">
          <!-- 할 일 내용 입력 필드 -->
          <div class="input-field-group">
            <label for="todo-input" class="visually-hidden">할 일 내용</label>
            <input 
              type="text" 
              id="todo-input" 
              class="todo-input" 
              placeholder="새로운 할 일을 입력하세요... (Enter로 등록)" 
              maxlength="150"
              required
            >
          </div>

          <!-- 태그 선택 드롭다운 -->
          <div class="select-field-group">
            <label for="todo-tag-select" class="visually-hidden">태그 선택</label>
            <select id="todo-tag-select" class="todo-tag-select">
              <option value="공부">📚 공부</option>
              <option value="운동">💪 운동</option>
              <option value="개인">🏠 개인</option>
              <option value="업무">💼 업무</option>
              <option value="기타">📌 기타</option>
            </select>
          </div>

          <!-- 추가 버튼 -->
          <button type="submit" id="add-btn" class="btn btn-primary add-btn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>추가</span>
          </button>
        </div>
        <!-- 입력 유효성 피드백 메시지 (경고 등) -->
        <p id="input-error" class="input-error-msg" style="display: none;"></p>
      </form>
    </section>

    <!-- 필터 영역 (태그 필터 + 상태 필터) -->
    <section class="filter-section" aria-label="할 일 필터링 옵션">
      <!-- 태그별 필터 버튼 그룹 -->
      <div class="filter-group">
        <span class="filter-label">태그별:</span>
        <div class="filter-buttons-wrapper" id="tag-filter-group" role="group" aria-label="태그별 필터">
          <button type="button" class="filter-chip active" data-tag="ALL">전체</button>
          <button type="button" class="filter-chip" data-tag="공부">📚 공부</button>
          <button type="button" class="filter-chip" data-tag="운동">💪 운동</button>
          <button type="button" class="filter-chip" data-tag="개인">🏠 개인</button>
          <button type="button" class="filter-chip" data-tag="업무">💼 업무</button>
          <button type="button" class="filter-chip" data-tag="기타">📌 기타</button>
        </div>
      </div>

      <!-- 완료 상태별 필터 버튼 그룹 -->
      <div class="filter-group">
        <span class="filter-label">상태별:</span>
        <div class="filter-buttons-wrapper" id="status-filter-group" role="group" aria-label="완료 상태 필터">
          <button type="button" class="filter-chip active" data-status="ALL">전체</button>
          <button type="button" class="filter-chip" data-status="ACTIVE">진행 중</button>
          <button type="button" class="filter-chip" data-status="COMPLETED">완료</button>
        </div>
      </div>
    </section>

    <!-- 할 일 목록 영역 -->
    <section class="todo-list-section" aria-label="할 일 목록">
      <div class="list-header">
        <h2 class="list-title">할 일 목록</h2>
        <span class="list-count-badge" id="list-count-badge">0개 항목</span>
      </div>

      <!-- 할 일 아이템 목록 (UL) -->
      <ul id="todo-list" class="todo-list" aria-live="polite">
        <!-- JavaScript에 의해 동적으로 렌더링됩니다 -->
      </ul>

      <!-- 빈 상태 (Empty State) 메시지 안내 영역 -->
      <div id="empty-state" class="empty-state" style="display: none;">
        <div class="empty-icon-wrapper">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M8 12h8"></path>
          </svg>
        </div>
        <h3 class="empty-title" id="empty-title">등록된 할 일이 없습니다.</h3>
        <p class="empty-desc" id="empty-desc">새로운 할 일을 추가하여 하루를 계획해 보세요!</p>
      </div>
    </section>
  </main>

  <!-- 자바스크립트 파일 연결 -->
  <script src="script.js"></script>
</body>
</html>
